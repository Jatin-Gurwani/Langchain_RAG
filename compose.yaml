services:
  qdrantdb:
    image: qdrant/qdrant:latest
    container_name: rag-qdrantdb
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile

    image: ragapi:test
    container_name: rag-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - qdrantdb

volumes:
  qdrant_data: